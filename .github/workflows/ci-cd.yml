name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: yourusername/cicd-demo
  REGISTRY: docker.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        pytest test_app.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
        docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
    
    - name: Test container
      run: |
        echo "Starting container..."
        docker run -d --name test-container -p 5000:5000 ${{ env.DOCKER_IMAGE }}:latest
        
        echo "Waiting for container to start..."
        sleep 5
        
        echo "Container logs:"
        docker logs test-container
        
        echo "Container status:"
        docker ps -a | grep test-container
        
        echo "Testing health endpoint..."
        for i in {1..10}; do
          if curl -v http://localhost:5000/health 2>&1; then
            echo "✓ Health check passed!"
            docker stop test-container
            exit 0
          fi
          echo "Attempt $i/10 failed, waiting..."
          sleep 3
        done
        
        echo "Final container logs:"
        docker logs test-container
        
        echo "Container failed to become healthy"
        docker stop test-container
        exit 1
