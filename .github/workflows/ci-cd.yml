name: Advanced CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: yourusername/cicd-demo
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install flake8 black || true
    - run: black --check app.py test_app.py || true
    - run: flake8 app.py test_app.py --max-line-length=100 || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt pytest-cov
    - run: pytest test_app.py -v --cov=app

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - run: docker build -t test-image .
    - name: Test container
      run: |
        docker run -d --name test-container -p 5000:5000 test-image
        for i in {1..30}; do
          if curl -f http://localhost:5000/health 2>/dev/null; then
            echo "Container healthy!"
            docker stop test-container
            exit 0
          fi
          sleep 2
        done
        docker logs test-container
        exit 1
