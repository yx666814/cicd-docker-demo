name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: yourusername/cicd-demo
  REGISTRY: docker.io

jobs:
  # ========== 作业1：测试 ==========
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        pytest test_app.py -v
    
    - name: Test coverage
      run: |
        pip install pytest-cov
        pytest --cov=app --cov-report=term

  # ========== 作业2：构建镜像 ==========
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # 测试通过才构建
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
        docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
    
    - name: Test container
      run: |
        docker run -d --name test-container -p 5000:5000 ${{ env.DOCKER_IMAGE }}:latest
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        docker stop test-container

  # ========== 作业3：安全扫描 ==========
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build image for scanning
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:scan .
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE }}:scan
        format: 'table'
        exit-code: '0'  # 0=只报告，1=有漏洞就失败
        severity: 'CRITICAL,HIGH'

  # ========== 作业4：推送镜像 ==========
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main'  # 只有 main 分支才推送
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:latest
          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ========== 作业5：部署 ==========
  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: push
    
    steps:
    - name: Determine environment
      id: env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
        else
          echo "environment=staging" >> $GITHUB_OUTPUT
        fi
    
    - name: Deploy notification
      run: |
        echo "🚀 Deploying to ${{ steps.env.outputs.environment }}"
        echo "Image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
        # 这里可以添加实际的部署命令，比如：
        # kubectl set image deployment/myapp myapp=${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        # 或 docker service update --image ${{ env.DOCKER_IMAGE }}:${{ github.sha }} myapp
